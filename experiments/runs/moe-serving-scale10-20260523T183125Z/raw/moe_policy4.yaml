apiVersion: v1
kind: Namespace
metadata:
  name: moe-serving
  labels:
    app: moe-serving

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: moe-serving
  labels:
    app: moe-serving
    component: frontend
    placement-policy: policy4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moe-serving
      component: frontend
  template:
    metadata:
      labels:
        app: moe-serving
        component: frontend
        placement-policy: policy4
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      nodeSelector:
        idynamics.dev/scale10: "true"

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: idynamics.io/placement-group
                operator: In
                values: ["moe-hybrid"]

      containers:
      - name: frontend
        image: moe-serving:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: MOE_ROLE
          value: "frontend"
        - name: SERVICE_NAME
          value: "frontend"
        - name: EXPERTS
          value: "8"
        - name: COMPUTE_DELAY_MS
          value: "5.0"
        - name: EXPERT_DELAY_MS
          value: "5.0"
        - name: PAYLOAD_BYTES
          value: "256"
        - name: CACHE_HIT_RATIO
          value: "0.3"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: moe-serving
  labels:
    app: moe-serving
    component: frontend
spec:
  selector:
    app: moe-serving
    component: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080

