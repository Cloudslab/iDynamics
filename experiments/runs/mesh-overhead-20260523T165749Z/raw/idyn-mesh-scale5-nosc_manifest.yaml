
apiVersion: v1
kind: Namespace
metadata:
  name: idyn-mesh-scale5-nosc
  labels:
    istio-injection: disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-server
  namespace: idyn-mesh-scale5-nosc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-server
  template:
    metadata:
      labels:
        app: fortio-server
        benchmark: mesh-overhead
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: /stats/prometheus
    spec:
      nodeSelector:
        idynamics.dev/scale5: "true"
      containers:
      - name: fortio-server
        image: fortio/fortio:1.69.3
        imagePullPolicy: IfNotPresent
        args: ["server", "-http-port", "8080"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fortio-server
  namespace: idyn-mesh-scale5-nosc
spec:
  selector:
    app: fortio-server
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-client
  namespace: idyn-mesh-scale5-nosc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-client
  template:
    metadata:
      labels:
        app: fortio-client
        benchmark: mesh-overhead
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: /stats/prometheus
    spec:
      nodeSelector:
        idynamics.dev/scale5: "true"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["fortio-server"]
              topologyKey: kubernetes.io/hostname
      containers:
      - name: fortio-client
        image: fortio/fortio:1.69.3
        imagePullPolicy: IfNotPresent
        args: ["server", "-http-port", "8082"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
