repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        files: ^(src|tests|scripts|reproducibility)/.*\.py$
      - id: codespell
        name: codespell
        entry: codespell --toml pyproject.toml
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: ^(benchmarks|reproducibility)/.*\.sh$
      - id: markdown-links
        name: markdown-links
        entry: python scripts/check_markdown_links.py
        language: system
        pass_filenames: false
