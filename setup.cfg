[metadata]
name = idynamics
version = attr: idynamics._version.__version__
description = Configurable emulation framework for cloud-edge microservice scheduling research
long_description = file: README.md
long_description_content_type = text/markdown
author = Ming Chen
author_email = mingc4@student.unimelb.edu.au
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering

[options]
package_dir =
    = src
packages = find_namespace:
python_requires = >=3.10
include_package_data = False

[options.packages.find]
where = src
include =
    idynamics*
    iDynamicsPackagesModules*
exclude =
    iDynamicsPackagesModules.Evaluations*

[options.package_data]
idynamics = py.typed

[options.extras_require]
analysis =
    matplotlib
    networkx
    numpy
    pandas
    prometheus-api-client
    seaborn
cluster =
    kubernetes
    paramiko
dev =
    build
    codespell
    pre-commit
    pytest
    ruff
    shellcheck-py
    wheel
