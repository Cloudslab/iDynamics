    generation_scripts:
      - "iDynamicsPackagesModules/NetworkingDynamicsManager/iDelay/Emulator_delay/node_delay_injection_V3.py"
      - "iDynamicsPackagesModules/NetworkingDynamicsManager/node_delay_measure_ParallelComp.py"
      - "iDynamicsPackagesModules/NetworkingDynamicsManager/iBandwidth/Emulator_bandwidth/node_bandwdith_injection_V3.py"
      - "iDynamicsPackagesModules/NetworkingDynamicsManager/node_bandwidth_measure_ParallelComp.py"
    claim_boundary: "Summarizes 9-worker directed-pair delay and saturated-bandwidth validation; supports emulation accuracy for that controlled matrix only, not production network isolation or WAN realism."

