manifest_version: 1
scope: "Mapping for manuscript Tables I-VIII and evaluation Figures 7-9."
artifact_bundle_root: "experiments/runs"
raw_data_policy: "Large raw ledgers are referenced by relative path and are not stored under reproducibility/."
excluded_from_public_repo:
  - "large raw ledgers"
  - "environment snapshots"
  - "logs"
  - "cluster access files"
  - "secret material"
  - "command histories"

items:
  - item_id: table-i
    manuscript_ref: "Table I"
    label: "tab:table_relatedWork"
    title: "Capability comparison with representative work"
    folder: "reproducibility/items/table-i-capability-comparison"
    source_run_ids: []
    raw_inputs:
      - "paper bibliography entries for the compared systems"
      - "capability definitions in the table legend"
      - "repository implementation and benchmark inventory for the iDynamics row"
    processed_inputs:
      - "manual capability coding table in the manuscript source"
    generation_scripts: []
    claim_boundary: "Literature and feature-scope comparison only; it is not an empirical performance result."

  - item_id: table-ii
    manuscript_ref: "Table II"
    label: "tab:istio_mesh_overhead"
    title: "Istio sidecar overhead in a controlled Fortio benchmark"
    folder: "reproducibility/items/table-ii-istio-mesh-overhead"
    source_run_ids:
      - "mesh-overhead-20260523T165749Z"
    raw_inputs:
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/fortio_repetitions.csv"
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/container_resources.csv"
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/idyn-mesh-scale5-nosc_rep[1-5]_fortio_stdout.json"
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/idyn-mesh-scale5-sc_rep[1-5]_fortio_stdout.json"
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/idyn-mesh-scale20-nosc_rep[1-5]_fortio_stdout.json"
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/idyn-mesh-scale20-sc_rep[1-5]_fortio_stdout.json"
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/idyn-mesh-scale45-nosc_rep[1-5]_fortio_stdout.json"
      - "experiments/runs/mesh-overhead-20260523T165749Z/raw/idyn-mesh-scale45-sc_rep[1-5]_fortio_stdout.json"
    processed_inputs:
      - "experiments/runs/mesh-overhead-20260523T165749Z/processed/mesh_overhead_summary.csv"
      - "experiments/runs/mesh-overhead-20260523T165749Z/processed/mesh_overhead_summary.json"
      - "experiments/runs/mesh-overhead-20260523T165749Z/processed/detailed_statistics.csv"
      - "experiments/runs/mesh-overhead-20260523T165749Z/processed/detailed_statistics.json"
    generation_scripts:
      - "scripts/experiments/mesh_overhead_benchmark.py"
      - "scripts/evaluation/summarize_run.py"
    claim_boundary: "Controlled two-service Fortio no-sidecar versus sidecar path at 5, 20, and 45 worker placement-pool scales; not a universal mesh-overhead estimate for all applications, payloads, or mesh policies."

