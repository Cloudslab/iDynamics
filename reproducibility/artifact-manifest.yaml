      - "delay_matrix_2025-03-17_05-32.csv"
      - "2025_Feb_05_0408_bandwidth_injection.log"
      - "bandwidth_results_2025-02-05_04-13.csv"
      - "bandwidth_results_2025-02-05_04-14.csv"
      - "bandwidth_results_2025-03-11_04-20.json"
    raw_inputs:
      - "iDynamicsPackagesModules/NetworkingDynamicsManager/iDelay/Emulator_delay/delay_matrix_directed.csv"
      - "iDynamicsPackagesModules/NetworkingDynamicsManager/iDelay/Emulator_delay/delay_matrix_2025-03-17_05-32.csv"
      - "iDynamicsPackagesModules/NetworkingDynamicsManager/iDelay/Emulator_delay/initial_node_latency_millSec.csv"
