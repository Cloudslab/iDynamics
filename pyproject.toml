[build-system]
requires = ["setuptools>=59", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: offline unit tests that do not require a live cluster",
  "integration: tests that exercise multiple repository components",
  "live_cluster: tests that require Kubernetes, service mesh, or traffic-control access",
  "slow: tests that are expected to take longer than normal unit tests",
  "packaging: package metadata, import, and distribution checks",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "build",
  "dist",
  "external",
  "reproducibility/generated",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.codespell]
skip = "*.png,*.pyc,*.csv,*.json,*.tex,*.sha256,*.svg,build,dist,external,reproducibility/generated"
ignore-words-list = "iDynamics,HDA,hda,wrk,wrk2,te,Measuer,bandwdith,ndoe,worklaod,Polcies"
