benchmark: deathstar-hotel
replica_profiles:
  replica1:
    description: Baseline one replica for Hotel application and dependency deployments.
    application_replicas: 1
    dependency_replicas: 1
    application_services: [frontend, geo, profile, rate, recommendation, reservation, search, user]
  replica3:
    description: Three replicas for Hotel stateless application services; dependencies stay singleton.
    application_replicas: 3
    dependency_replicas: 1
    application_services: [frontend, geo, profile, rate, recommendation, reservation, search, user]
  replica5:
    description: Five replicas for Hotel stateless application services; dependencies stay singleton.
    application_replicas: 5
    dependency_replicas: 1
    application_services: [frontend, geo, profile, rate, recommendation, reservation, search, user]
