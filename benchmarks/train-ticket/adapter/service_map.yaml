benchmark: train-ticket
namespace_default: idyn-train-ticket
entrypoints:
  - name: ui-dashboard
    service: ts-ui-dashboard
    port: 8080
    protocol: HTTP
    path: /
  - name: gateway
    service: ts-gateway-service
    port: 18888
    protocol: HTTP
    path: /
core_services:
  - ts-ui-dashboard
  - ts-gateway-service
  - ts-auth-service
  - ts-user-service
  - ts-contacts-service
  - ts-order-service
  - ts-preserve-service
  - ts-payment-service
  - ts-ticketinfo-service
  - ts-travel-service
  - ts-route-service
  - ts-basic-service
  - ts-config-service
  - ts-cancel-service
  - ts-assurance-service
  - ts-admin-basic-info-service
  - ts-admin-order-service
  - ts-admin-route-service
  - ts-admin-travel-service
  - ts-admin-user-service
dependencies:
  - mongodb services
  - mysql services
  - rabbitmq
  - consul
notes:
  - Large dependency footprint; start with larger prepared worker pools.
  - No maintained workload generator is assumed by this package.
