benchmark: online-boutique
generator: in-cluster-locust-plus-port-forward-http
default:
  users: 10
  rate: 5
  duration_seconds: 45
  repeats: 3
  concurrency: 8
paths:
  - path: /
    weight: 40
  - path: /product/0PUK6V6EV0
    weight: 25
  - path: /product/2ZYFJ3GM2N
    weight: 25
  - path: /cart
    weight: 10
environment:
  loadgenerator:
    USERS: "${IDYN_USERS:-10}"
    RATE: "${IDYN_RATE:-5}"
    FRONTEND_ADDR: frontend:80
claim_boundary: Load mix is valid for evidence only when archived in a run ledger.
