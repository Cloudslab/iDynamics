benchmark: online-boutique
display_name: Online Boutique / Google Microservices Demo
category: third-party microservice benchmark
status: packaged adapter
priority: primary
source:
  url: https://github.com/GoogleCloudPlatform/microservices-demo.git
  reference_commit: 5096a85b2f3bf41bef53363cfe5478d5b86ac701
  local_checkout: external/benchmarks/online-boutique
  vendored: false
license:
  upstream: Apache-2.0
default_namespace: idyn-online-boutique
adapter_files:
  service_map: adapter/service_map.yaml
  workload_mix: adapter/workload_mix.yaml
  replica_profiles: adapter/replica_profiles.yaml
scripts:
  fetch: scripts/fetch.sh
  deploy: scripts/deploy.sh
  smoke: scripts/smoke.sh
  load: scripts/load.sh
  collect: scripts/collect.sh
  cleanup: scripts/cleanup.sh
  reproduce: scripts/reproduce.sh
deployment:
  method: kubectl apply
  manifest: release/kubernetes-manifests.yaml
  entry_service: frontend
  entry_port: 80
telemetry:
  mesh: Istio
  namespace_label: idynamics.dev/benchmark=online-boutique
known_limitations:
  - Release manifests may require image registry access from the target cluster.
  - The in-cluster load generator exercises the HTTP frontend while most service edges are gRPC.
  - Optional cloud-provider overlays are intentionally outside this package.
