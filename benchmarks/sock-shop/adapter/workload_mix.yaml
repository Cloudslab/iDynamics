benchmark: sock-shop
generator: bounded-http-load
default:
  clients: 5
  hatch_rate: 5
  requests: 100
  duration_seconds: 30
paths:
  - path: /
    weight: 40
  - path: /catalogue
    weight: 30
  - path: /basket.html
    weight: 20
  - path: /login
    weight: 10
claim_boundary: Archived compatibility workload only unless ledger-backed.
