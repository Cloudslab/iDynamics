benchmark: sock-shop
display_name: Sock Shop
category: third-party microservice benchmark
status: packaged adapter
priority: archived-compatibility
source:
  url: https://github.com/microservices-demo/microservices-demo.git
  reference_commit: 9dff06fae4981921caec6a62393a6ebfce4b3e3f
  local_checkout: external/benchmarks/sock-shop
  vendored: false
license:
  upstream: Apache-2.0
default_namespace: idyn-sock-shop
adapter_files:
  service_map: adapter/service_map.yaml
  workload_mix: adapter/workload_mix.yaml
  replica_profiles: adapter/replica_profiles.yaml
scripts:
  fetch: scripts/fetch.sh
  deploy: scripts/deploy.sh
  smoke: scripts/smoke.sh
  load: scripts/load.sh
  collect: scripts/collect.sh
  cleanup: scripts/cleanup.sh
  reproduce: scripts/reproduce.sh
deployment:
  method: kubectl apply
  manifests:
    - deploy/kubernetes/manifests
    - deploy/kubernetes/manifests-loadtest
  entry_service: front-end
  entry_port: 80
telemetry:
  mesh: Istio
  namespace_label: idynamics.dev/benchmark=sock-shop
known_limitations:
  - Upstream project is archived/deprecated; use as compatibility coverage.
  - Older images and manifests may need cluster-specific compatibility patches.
  - REST-only service graph is less representative of gRPC-heavy workloads.
