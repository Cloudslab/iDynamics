benchmark: social-network
display_name: DeathStarBench Social Network
category: third-party microservice benchmark
status: packaged adapter
priority: requested-real-benchmark
source:
  url: https://github.com/delimitrou/DeathStarBench.git
  reference_commit: 6ecb09706140f8730b5385c08f1386c654c3c526
  subdirectory: socialNetwork
  local_checkout: external/benchmarks/deathstarbench
  vendored: false
license:
  upstream: Apache-2.0
default_namespace: idyn-social-network
adapter_files:
  service_map: adapter/service_map.yaml
  workload_mix: adapter/workload_mix.yaml
  replica_profiles: adapter/replica_profiles.yaml
scripts:
  fetch: scripts/fetch.sh
  deploy: scripts/deploy.sh
  smoke: scripts/smoke.sh
  load: scripts/load.sh
  collect: scripts/collect.sh
  cleanup: scripts/cleanup.sh
  reproduce: scripts/reproduce.sh
deployment:
  method: helm
  chart: socialNetwork/helm-chart/socialnetwork
  entry_service: nginx-thrift
  entry_port: 8080
telemetry:
  mesh: Istio
  namespace_label: idynamics.dev/benchmark=social-network
known_limitations:
  - Stateful MongoDB, Redis, Memcached, and Jaeger components can dominate startup time.
  - The upstream chart may clone or initialize benchmark assets during pod startup.
  - Use run outputs as performance evidence only when deployment, load, and collection all complete.
