benchmark: social-network
generator: bounded-http-load
default:
  duration_seconds: 45
  concurrency: 8
request_types:
  - compose_post
  - read_home_timeline
  - read_user_timeline
mix:
  read_home_timeline: 60
  read_user_timeline: 30
  compose_post: 10
paths:
  - path: /wrk2-api/home-timeline/read
    weight: 70
  - path: /wrk2-api/user-timeline/read
    weight: 30
claim_boundary: Manual load output is operational evidence unless archived with full run context.
