benchmark: social-network
replica_profiles:
  replica1:
    description: Upstream chart defaults, one replica per service.
    application_replicas: 1
    dependency_replicas: 1
  replica3:
    description: Three replicas for stateless Social Network services; dependencies remain singleton.
    application_replicas: 3
    dependency_replicas: 1
    application_services:
      - nginx-thrift
      - compose-post-service
      - home-timeline-service
      - user-timeline-service
      - user-service
      - text-service
      - unique-id-service
      - media-service
      - post-storage-service
      - social-graph-service
      - url-shorten-service
      - user-mention-service
  replica5:
    description: Five replicas for stateless Social Network services; dependencies remain singleton.
    application_replicas: 5
    dependency_replicas: 1
    application_services:
      - nginx-thrift
      - compose-post-service
      - home-timeline-service
      - user-timeline-service
      - user-service
      - text-service
      - unique-id-service
      - media-service
      - post-storage-service
      - social-graph-service
      - url-shorten-service
      - user-mention-service
