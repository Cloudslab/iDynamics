benchmark: moe-serving
generator: examples/moe-serving/workload/generate_load.py
default:
  experts: 6
  requests: 120
  qps: 10
  top_k: 2
  skew_mode: sinusoidal
  compute_delay_ms: 5
  payload_bytes: 1024
  cache_hit_ratio: 0.0
request_types:
  - single_expert
  - multi_expert_top2
  - multi_expert_top4
  - cache_hit
  - cache_miss
  - payload_small
  - payload_large
  - batch_small
  - batch_large
scenarios:
  step:
    description: Piecewise hot request class and expert shifts.
    skew_mode: step
  linear:
    description: Gradual movement from early to late request classes and experts.
    skew_mode: linear
  sinusoidal:
    description: Smooth periodic request-class and expert popularity changes.
    skew_mode: sinusoidal
  markov:
    description: Correlated hot-expert transitions with stochastic persistence.
    skew_mode: markov
  expert_skew_shift:
    description: MoE-specific hot-expert drift with adjacent expert pressure.
    skew_mode: expert_skew_shift
  cache_stress:
    description: Alternates cache-hit and cache-miss dominated traffic.
    skew_mode: cache_stress
  payload_heavy:
    description: Emphasizes large payload and large batch requests.
    skew_mode: payload_heavy
claim_boundary: Workload rows and summaries must be archived under experiments/runs for reported results.
