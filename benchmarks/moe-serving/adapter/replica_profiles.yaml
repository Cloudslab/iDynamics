{
  "benchmark": "moe-serving",
  "replica_profiles": {
    "replica1": {
      "description": "Baseline one replica for stateless MoE path services and each expert.",
      "stateless_replicas": 1,
      "expert_replicas": 1,
      "stateless_services": [
        "frontend",
        "tokenizer",
        "router",
        "aggregator"
      ],
      "expert_service_pattern": "expert-{index}",
      "expert_count_field": "experts",
      "replicas_per_expert": 1,
      "router_replicas": 1,
      "aggregator_replicas": 1,
      "cache_replicas": 1,
      "state_replicas": 1,
      "total_app_pods_formula": "frontend + tokenizer + router + aggregator + cache + expert_count * replicas_per_expert",
      "single_replica_services": [
        "cache"
      ]
    },
