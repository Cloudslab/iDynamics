benchmark: moe-serving
runtime_boundary:
  cpu_only: true
replica_profiles:
  replica1:
    description: One frontend, tokenizer, router, aggregator, cache, and one replica per expert.
    stateless_replicas: 1
    expert_replicas: 1
    expert_count_default: 4
  replica3:
    description: Three replicas for stateless path services and each expert; cache remains singleton.
    stateless_replicas: 3
    expert_replicas: 3
    cache_replicas: 1
    expert_count_default: 4
  replica5:
    description: Five replicas for stateless path services and each expert; cache remains singleton.
    stateless_replicas: 5
    expert_replicas: 5
    cache_replicas: 1
    expert_count_default: 4
