benchmark: moe-serving
display_name: CPU-only MoE-style Serving Microbenchmark
status: first-class
priority: primary-moe
source:
  local_path: examples/moe-serving
  implementation: examples/moe-serving/moe_service/server.py
license: repository-local
default_namespace: idyn-moe-serving
runner: scripts/experiments/run_physical_moe_k8s.py
supported_scales:
  - scale5
