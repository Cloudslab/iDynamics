name: Bug report
description: Report a reproducible defect in the package, scripts, docs, or artifact checks.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Include only public, shareable details and remove credentials, cluster endpoints, private paths, and operational logs that should not be public.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and which component is affected?
      placeholder: The policy runner fails when...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest public command sequence or input snippet that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Paste the relevant public error text or describe the observed result.
    validations:
      required: true
  - type: dropdown
    id: evidence-scope
    attributes:
      label: Evidence scope
      description: Select the closest scope for the reported behavior.
      options:
        - Offline package or unit test
        - Data-only reproducibility artifact
        - Benchmark adapter dry run or smoke test
        - Live-cluster workflow
        - Documentation or metadata
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include public version information only.
      placeholder: |
        Python:
        Operating system:
        iDynamics version or commit:
        Optional tools:
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Public report checklist
      options:
        - label: I removed credentials, private hostnames, private network details, and non-public logs.
          required: true
        - label: I described whether the issue affects offline artifacts, live-cluster workflows, or documentation.
          required: true
