name: Reproducibility artifact issue
description: Report a problem with artifact structure, checksums, regeneration, or evidence boundaries.
title: "[Artifact]: "
labels:
  - reproducibility
body:
  - type: markdown
    attributes:
      value: |
        Use this template for public data-only artifact issues. Do not attach raw ledgers, private logs, credentials, or cluster access files.
  - type: input
    id: artifact
    attributes:
      label: Artifact item
      description: Table, figure, or folder path.
      placeholder: reproducibility/items/table-v-network-trace-provider
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Public command that showed the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Include public error text, checksum mismatch, or generated-output difference.
    validations:
      required: true
  - type: dropdown
    id: evidence-type
    attributes:
      label: Evidence type
      options:
        - Live physical
        - Replay
        - Synthetic control-plane
        - Compatibility
        - CPU-only MoE
        - Documentation or metadata
    validations:
      required: true
  - type: textarea
    id: expected-boundary
    attributes:
      label: Expected evidence boundary
      description: What claim boundary should the artifact preserve?
      placeholder: Matrix statistics only; not application latency or scheduler quality.
    validations:
      required: true
  - type: checkboxes
    id: public-safety
    attributes:
      label: Public artifact checklist
      options:
        - label: I did not attach large raw ledgers, environment snapshots, credentials, or private cluster details.
          required: true
        - label: I checked the relevant item manifest and README before filing.
          required: true
