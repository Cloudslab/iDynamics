name: Feature request
description: Propose a public API, benchmark adapter, policy, documentation, or artifact improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the requested change in terms of the public repository surface and the evidence it would support.
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What public use case, workflow, or artifact gap would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired behavior, command, file, API, or documentation update.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Python API
        - Scheduling policy
        - Network dynamics
        - Benchmark adapter
        - Reproducibility artifact
        - Documentation
        - Packaging or maintenance
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Evidence boundary
      description: State what the requested change should and should not claim.
      placeholder: This would support adapter compatibility checks, not new performance claims.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional notes on current workarounds or related approaches.
    validations:
      required: false
